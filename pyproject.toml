[project]
name = "vault-api"
version = "0.1.0"
requires-python = ">=3.12"
# Only what this service imports directly. Everything else (prometheus-client, aiocache,
# cryptography, python-dotenv, …) comes in transitively via tashtiot-apis-library — declaring
# it here again just invites the two to drift.
dependencies = [
    "fastapi>=0.115.6",
    "httpx>=0.27.2",
    "loguru>=0.7",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0.1",
    "starlette>=0.41.3",
    "tashtiot-apis-library>=1.1.0",
    "uvicorn>=0.22.0",
]

[tool.uv]
package = false
# NOTE: index-strategy lives in uv.toml, not here — when a uv.toml exists it takes
# precedence and this section's uv settings are ignored. See uv.toml.example / README.

# NOTE: there is deliberately no [tool.uv.sources] block. It used to point
# tashtiot-apis-library at the sibling ../apis-library checkout, which made `uv lock` record
# `editable = "../apis-library"` — a path that does not exist in Docker or CI, so
# `uv sync --frozen` failed in both. The library is resolved from Artifactory instead.
#
# `sources` cannot be moved to an untracked uv.toml (uv rejects it: "sources is only
# applicable in the context of a project"), so to develop against the local library, overlay
# it onto the synced venv instead of declaring it here:
#
#     uv sync --group dev
#     uv pip install -e ../apis-library

[dependency-groups]
# Ranges, not exact pins: the exact versions aren't published on the internal
# Artifactory mirror. uv.lock still pins the resolved versions for reproducibility.
dev = [
    "coverage>=7.5.2",
    # tests/conftest.py mints HS256 tokens for the auth middleware.
    "pyjwt>=2.8",
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.6",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
